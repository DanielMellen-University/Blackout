<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Blackout">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="jet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9aa7b5"/>
      <stop offset="55%" stop-color="#6b7785"/>
      <stop offset="100%" stop-color="#3d4652"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#3db8ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5cc8ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3db8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#2a3a52" stroke-width="1.5"/>
  <!-- soft horizon -->
  <path d="M8 42h48" stroke="#1e2c40" stroke-width="1" opacity="0.7"/>
  <!-- F-35-ish top-down silhouette -->
  <g transform="translate(32 33) rotate(-18)">
    <!-- wings -->
    <path d="M-4 -2 L-26 4 L-24 8 L-3 3 Z" fill="url(#jet)"/>
    <path d="M4 -2 L26 4 L24 8 L3 3 Z" fill="url(#jet)"/>
    <!-- tails -->
    <path d="M-2 10 L-9 18 L-6 19 L0 12 Z" fill="#5a6570"/>
    <path d="M2 10 L9 18 L6 19 L0 12 Z" fill="#5a6570"/>
    <!-- fuselage -->
    <path d="M0 -22 C3 -18 4 -6 3.2 6 C2.6 14 1.4 20 0 24 C-1.4 20 -2.6 14 -3.2 6 C-4 -6 -3 -18 0 -22 Z" fill="url(#jet)"/>
    <!-- canopy -->
    <ellipse cx="0" cy="-8" rx="1.6" ry="3.2" fill="#7ec8ff" opacity="0.85"/>
    <!-- exhaust glow -->
    <ellipse cx="0" cy="25" rx="3.5" ry="1.4" fill="url(#glow)"/>
  </g>
  <!-- wordmark accent -->
  <circle cx="50" cy="14" r="2" fill="#5cc8ff" opacity="0.9"/>
</svg>
