<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackout</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body oncontextmenu="return false;">
    <div id="app">
      <canvas id="game" oncontextmenu="return false;"></canvas>
      <div id="overlay">
        <header id="title-bar">
          <h1>BLACKOUT</h1>
          <span id="phase-badge">Phase 2 · Flight</span>
        </header>
        <div id="hud">
          <div class="hud-row">
            <span class="label">SPD</span>
            <span id="hud-spd">0 kts</span>
          </div>
          <div class="hud-row">
            <span class="label">ALT</span>
            <span id="hud-pos">0 m</span>
          </div>
          <div class="hud-row">
            <span class="label">THR</span>
            <span id="hud-thr">0%</span>
          </div>
          <div class="hud-row">
            <span class="label">GEAR</span>
            <span id="hud-gear">DOWN</span>
          </div>
          <div class="hud-row">
            <span class="label">STATE</span>
            <span id="hud-state">GND</span>
          </div>
          <div class="hud-row">
            <span class="label">CAM</span>
            <span id="hud-cam">chase</span>
          </div>
        </div>
        <div id="hud-banner" class="banner" hidden></div>
        <aside id="help">
          <p><kbd>W</kbd><kbd>S</kbd> pitch · <kbd>A</kbd><kbd>D</kbd> yaw · <kbd>Q</kbd><kbd>E</kbd> roll · <kbd>Shift</kbd> thr+ · <kbd>Ctrl</kbd> thr- · <kbd>Space</kbd> AB</p>
          <p><kbd>G</kbd> gear · <kbd>C</kbd> camera · hold <kbd>MMB</kbd> look · <kbd>R</kbd> reset · takeoff: <kbd>Shift</kbd> thr, then <kbd>W</kbd> at speed</p>
        </aside>
        <div id="fps"><span id="hud-fps">-</span> fps</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
