<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackout</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body oncontextmenu="return false;">
    <div id="app">
      <canvas id="game" oncontextmenu="return false;"></canvas>
      <div id="overlay">
        <header id="title-bar">
          <h1>BLACKOUT</h1>
          <span id="phase-badge">Phase 3 · Instruments</span>
        </header>
        <div id="hud">
          <div class="hud-row">
            <span class="label">ALT</span>
            <span id="hud-pos">0 m</span>
          </div>
          <div class="hud-row">
            <span class="label">GEAR</span>
            <span id="hud-gear">DOWN</span>
          </div>
          <div class="hud-row">
            <span class="label">STATE</span>
            <span id="hud-state">GND</span>
          </div>
          <div class="hud-row">
            <span class="label">CAM</span>
            <span id="hud-cam">chase</span>
          </div>
        </div>

        <!-- Bottom-left: speedometer + engine power (min↔max) -->
        <div id="gauges">
          <div class="gauge-panel" id="speedo-panel" aria-label="Airspeed">
            <svg class="gauge-svg" viewBox="0 0 140 140" aria-hidden="true">
              <defs>
                <linearGradient id="spd-arc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#3a9fd8" />
                  <stop offset="70%" stop-color="#5ec8ff" />
                  <stop offset="100%" stop-color="#ff8a4a" />
                </linearGradient>
              </defs>
              <circle class="gauge-face" cx="70" cy="70" r="58" />
              <path
                class="gauge-track"
                d="M 22 96 A 52 52 0 1 1 118 96"
                fill="none"
              />
              <path
                id="spd-arc"
                class="gauge-arc spd"
                d="M 22 96 A 52 52 0 1 1 118 96"
                fill="none"
                pathLength="100"
              />
              <g id="spd-ticks" class="gauge-ticks"></g>
              <line id="spd-needle" class="gauge-needle" x1="70" y1="70" x2="70" y2="24" />
              <circle class="gauge-hub" cx="70" cy="70" r="5" />
            </svg>
            <div class="gauge-readout">
              <span id="hud-spd" class="gauge-value">0</span>
              <span class="gauge-unit">KTS</span>
            </div>
            <div class="gauge-title">IAS</div>
          </div>

          <div class="gauge-panel" id="eng-panel" aria-label="Engine power">
            <div class="eng-header">
              <span class="gauge-title">ENG</span>
              <span id="hud-thr" class="eng-pct">0%</span>
            </div>
            <div class="eng-bar-wrap">
              <div class="eng-scale">
                <span>MAX</span>
                <span>MIN</span>
              </div>
              <div class="eng-track">
                <div
                  id="eng-fill"
                  class="eng-fill"
                  role="meter"
                  aria-label="Engine power"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                ></div>
                <div id="eng-marker" class="eng-marker"></div>
              </div>
            </div>
            <div class="eng-hint"><kbd>Shift</kbd> + · <kbd>Ctrl</kbd> −</div>
            <div id="eng-ab" class="eng-ab" hidden>AB</div>
          </div>
        </div>

        <!-- Center: attitude indicator (pitch ladder + bank) -->
        <div id="attitude" aria-label="Attitude indicator">
          <div id="adi-mask">
            <div id="adi-ball">
              <div id="adi-sky"></div>
              <div id="adi-ground"></div>
              <div id="adi-horizon"></div>
              <div id="adi-ladder"></div>
            </div>
          </div>
          <div id="adi-fixed" aria-hidden="true">
            <div class="adi-wing left"></div>
            <div class="adi-wing right"></div>
            <div class="adi-dot"></div>
          </div>
          <div id="adi-bank-marks" aria-hidden="true"></div>
          <div id="adi-bank-ptr" aria-hidden="true"></div>
          <div id="adi-readout">
            <span id="adi-pitch">0°</span>
            <span id="adi-roll">0°</span>
          </div>
        </div>

        <div id="hud-banner" class="banner" hidden></div>
        <aside id="help">
          <p><kbd>W</kbd><kbd>S</kbd> pitch · <kbd>A</kbd><kbd>D</kbd> yaw · <kbd>Q</kbd> roll right · <kbd>E</kbd> roll left · <kbd>Shift</kbd> ENG+ · <kbd>Ctrl</kbd> ENG− · <kbd>Space</kbd> AB</p>
          <p><kbd>G</kbd> gear · <kbd>C</kbd> camera · hold <kbd>MMB</kbd> look · <kbd>R</kbd> reset · takeoff: <kbd>Shift</kbd> thr, then <kbd>W</kbd> at speed</p>
        </aside>
        <div id="fps"><span id="hud-fps">-</span> fps</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
