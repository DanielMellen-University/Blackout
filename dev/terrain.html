<!doctype html>
<html lang="en">
<meta charset="UTF-8">
<title>Blackout - terrain review</title>
<style>

  nav { position:absolute; top:20px; left:20px; padding:14px; background:#132030dd }

<nav><b>BLACKOUT / TERRAIN REVIEW</b><button id="reseed">New world</button>
  <select id="destination" aria-label="Terrain destination">
    <option value="">Airfield</option><option value="alpine">Alpine range</option>
    <option value="lake">Irregular lake</option><option value="ocean">Inland sea</option>
    <option value="pond">Small ponds</option>
    <option value="green">Green hills</option><option value="river">River valley</option>

    <option value="lakeoutlet">Lake outlet junction</option>
    <option value="mesa">Badlands</option><option value="volcano">Volcanic country</option>

  <select id="review-view" aria-label="River camera">
    <option value="overview">Overview</option><option value="chase">Chase</option>

  </select>
  <input id="river-progress" aria-label="River progress" type="range" min="0" max="1000" value="0" style="width:100px">
  <input id="weather-progress" aria-label="Weather front progress" type="range" min="0" max="1000" value="0" style="width:120px" hidden>
  <input id="weather-height" aria-label="Weather review height above ground" title="Height above ground (0-5000 m)" type="range" min="0" max="5000" value="220" style="width:100px" hidden>
  <select id="flight-speed" aria-label="Benchmark speed">
    <option value="cruise">Cruise · 400 m/s</option>
    <option value="maximum" selected>Maximum afterburner speed</option>
  </select>
  <select id="weather" aria-label="Weather preset">
    <option value="automatic">Automatic</option>
    <option value="clear">Clear</option><option value="cloudy">Cloudy</option>
    <option value="overcast">Overcast</option><option value="fog">Fog</option>
    <option value="rain">Rain</option><option value="storm">Storm</option>
    <option value="snow">Snow</option><option value="blizzard">Blizzard</option>
  </select>
  <span id="seed"></span> · drag to orbit · scroll to zoom
  <span id="stats"></span>
  <div id="travel-stats"></div>
</nav>
<script type="module">
import * as T from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { World } from '/src/world/World.ts'
import { clearOpsPad, sampleClimate, sampleTerrainHeight } from '/src/world/terrainSample.ts'
import { getWorldSeed, setWorldSeed } from '/src/world/noise.ts'
import { waterLandmarks, riverReaches } from '/src/world/Hydrology.ts'
import { flightConfig } from '/src/aircraft/flightConfig.ts'
import { settlementForCell } from '/src/world/SettlementPlan.ts'
import { shouldConnectSettlements } from '/src/world/RegionalRoads.ts'
import { Aircraft } from '/src/aircraft/Aircraft.ts'
import { CameraSystem } from '/src/camera/CameraSystem.ts'
const renderer=new T.WebGLRenderer({antialias:true})
renderer.setSize(innerWidth,innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))
renderer.toneMapping=T.ACESFilmicToneMapping
document.body.append(renderer.domElement)
const world=new World()
const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,1,60000)
const controls=new OrbitControls(camera,renderer.domElement)
const reviewJet=new Aircraft()
reviewJet.addTo(world.scene);reviewJet.mesh.visible=false
const chase=new CameraSystem(renderer.domElement)
chase.resize(innerWidth,innerHeight)
let flightView=false
let settlementRadius=0
let settlementKind=''
let settlementTop=700
let reviewPeak=0
let reviewPeakX=0
let reviewPeakZ=0
let reviewMode=''
let riverTour=[],riverTourIndex=0,riverTourT=0,tracingRiver=false,riverTourDirty=false
let riverTourOffsets=[0],riverTourLength=0
const requestedSeed=Number(new URLSearchParams(location.search).get('seed'))
const tourPosition=new T.Vector3(),tourAhead=new T.Vector3()

function findLandscapeTarget(startX,startZ,predicate,score=(climate)=>0){
  let best=null
  // Search a deterministic spiral so fixed review seeds keep finding the
  // requested province after the terrain generator changes.
  for(let ring=0;ring<=42;ring++){
    const count=ring?Math.max(8,ring*8):1
    const radius=ring*1000
    for(let i=0;i<count;i++){
      const angle=ring*0.73+i/count*Math.PI*2
      const x=startX+Math.cos(angle)*radius
      const z=startZ+Math.sin(angle)*radius
      const climate=sampleClimate(x,z)
      if(!predicate(climate))continue
      const distance=Math.hypot(x-startX,z-startZ)
      const value=score(climate)-distance*.0002
      if(!best||value>best.value)best={x,z,value}
    }
    // Once a strong nearby match exists, do not spend thousands of samples
    // searching for a marginally prettier point on the far side of the map.
    if(best&&ring>=8&&best.value>0.45)return best
  }
  return best??{x:startX,z:startZ,value:-Infinity}
}

function frameWorld(destination){
  settlementRadius=0
  settlementKind=''
  settlementTop=700
  reviewPeakX=0
  reviewPeakZ=0
  flightView=false;reviewJet.mesh.visible=false;controls.enabled=true
  tracingRiver=false;document.querySelector('#river-tour').textContent='Trace river'
  document.querySelector('#flight-view').textContent='Flight scale view'
  const {x,y,z}=destination ?? world.spawn
  world.atmosphere.randomizeWeather(getWorldSeed(),{x,y,z})
  world.atmosphere.timeOfDay=.48
  applyReviewWeather()
  let nearbyPeak=y
  // Volcanic cones and alpine shoulders can put the sampled center well below
  // the visible landform. Scan a wider local envelope so review cameras and
  // flight starts never end up inside a mountain.
  const emphasizePeak=!destination||reviewMode==='alpine'||reviewMode==='volcano'
  if(emphasizePeak)for(let ix=-6;ix<=6;ix++) for(let iz=-6;iz<=6;iz++) {
    const sampleX=x+ix*600,sampleZ=z+iz*600,sampleY=sampleTerrainHeight(sampleX,sampleZ)
    if(sampleY>nearbyPeak){nearbyPeak=sampleY;reviewPeakX=sampleX;reviewPeakZ=sampleZ}
  }
  reviewPeak=nearbyPeak
  const lookY=Math.max(y+15,nearbyPeak-900)
  camera.position.set(x+1800,Math.max(y+1300,nearbyPeak+900),z-1800)
  controls.target.set(x,lookY,z);controls.update()
  if(!destination||!emphasizePeak||Math.abs(nearbyPeak-y)<1200){reviewPeakX=x;reviewPeakZ=z}
  else {
    // High landforms need an oblique side view. Looking at the sampled center
    // can put the review camera inside a cone or alpine wall, leaving only fog.
    const sideX=reviewPeakX+3200,sideZ=reviewPeakZ-3200
    camera.position.set(sideX,nearbyPeak+500,sideZ)
    controls.target.set(reviewPeakX,nearbyPeak-900,reviewPeakZ);controls.update()
  }
  // Warm the review scene even when a background browser throttles animation.
  // Workers fill coverage asynchronously while the review keeps rendering.
  world.terrain.update(x,z,1/30)
  // Keep settlement streaming focused with the reviewed destination. Without
  // this kick, the previous airfield cell could remain authoritative while
  // the camera was already looking at a city or village several kilometres
  // away.
  world.settlements.update(x,z)
  world.atmosphere.update(10,x,y,z)
  world.atmosphere.timeOfDay=.48
  world.atmosphere.update(0,x,y,z)
  document.querySelector('#seed').textContent=' Seed '+Math.round(getWorldSeed())
}
frameWorld()
document.querySelector('#reseed').onclick=()=>{world.reseed();frameWorld()}
const destinations={
  pond:[1337,0,0],headwater:[1,0,0],
  alpine:[1337,-9600,8400],lake:[1,0,0],ocean:[1,0,0],river:[1,0,0],green:[1,-30000,-17400],
  riverjoin:[1337,-37939,17344],
  lakeoutlet:[73,-57928,-10085],
  mesa:[1,-30000,-27600],volcano:[1,-92800,-13600],
  city:[1337,5,-1],village:[1,-7,-5],
  roadlink:[1,-7,-5],
  weatherfront:[1,8000,-56000],weathersnow:[1,-200000,168000],
}
let weatherTraceDirty=false
let weatherTravelT=0,travelSeconds=0,travelDistance=0,travelStartHeap=0,travelPeakHeap=0
const travelFrames=new Float32Array(7200)
let travelFrameCount=0
function findSettlementNear(cx,cz,kind){
  // Settlement rarity and terrain suitability can change as generation evolves;
  // spiral outward from the review anchor instead of assuming one cell forever.
  for(let ring=0;ring<=14;ring++){
    for(let dx=-ring;dx<=ring;dx++) for(let dz=-ring;dz<=ring;dz++){
      if(ring>0&&Math.max(Math.abs(dx),Math.abs(dz))!==ring) continue
      const plan=settlementForCell(cx+dx,cz+dz)
      if(plan&&(!kind||plan.kind===kind)) return plan
    }
  }
  return null
}
function findWaterLandmark(sea,pond=false){
  // Water frequency is intentionally seeded and compact, so one hard-coded
  // catchment can be empty after a generator revision. Search neighboring
  // catchments deterministically instead of crashing the review scene.
  for(let ring=0;ring<=14;ring++){
    for(let dx=-ring;dx<=ring;dx++) for(let dz=-ring;dz<=ring;dz++){
      if(ring>0&&Math.max(Math.abs(dx),Math.abs(dz))!==ring) continue
      const basin=waterLandmarks(dx,dz).find(candidate=>candidate.sea===sea&&(!pond||candidate.pond))
      if(basin) return basin
    }
  }
  return null
}
function findRoadPair(cx,cz){
  const plans=[]
  const seen=new Set()
  for(let ring=0;ring<=10&&plans.length<28;ring++){
    for(let dx=-ring;dx<=ring;dx++) for(let dz=-ring;dz<=ring;dz++){
      if(ring>0&&Math.max(Math.abs(dx),Math.abs(dz))!==ring) continue
      const plan=settlementForCell(cx+dx,cz+dz)
      if(plan&&!seen.has(plan.id)){seen.add(plan.id);plans.push(plan)}
    }
  }
  for(let i=0;i<plans.length;i++) for(let j=0;j<i;j++){
    const a=plans[i],b=plans[j]
    const distance=Math.hypot(a.x-b.x,a.z-b.z)
    if(distance>12000&&distance<34000&&shouldConnectSettlements(a,b)) return {a,b}
  }
  return null
}
function visitDestination(value){
  const target=destinations[value]
  if(!target){frameWorld();return}
  reviewMode=value
  document.querySelector('#weather-progress').hidden=!value.startsWith('weather')
  document.querySelector('#weather-height').hidden=!value.startsWith('weather')
  document.querySelector('#weather-progress').value='0'
  weatherTraceDirty=value.startsWith('weather')
  weatherTravelT=0
  riverTour=[];riverTourLength=0
  let [seed,x,z]=target
  if(requestedSeed>0)seed=requestedSeed
  let settlement=null
  world.reseed(seed)
  // Fixed review seeds must remain inspectable even when that seed cannot
  // also provide a valid runway site under the current spawn constraints.
  if(world.worldSeed!==seed){setWorldSeed(seed);clearOpsPad();world.settlements.clearAll()}
  world.terrain.clearAll()
  // Terrain destinations are independent review scenes. Reset the settlement
  // stream too, otherwise the airfield's checked cells can keep an unrelated
  // village or city alive while this camera is aimed at the new destination.
  world.settlements.clearAll()
  if(value==='lake'||value==='ocean'||value==='pond'){
    const b=findWaterLandmark(value==='ocean',value==='pond')
    if(!b) throw new Error('Review water destination no longer has a matching basin')
    x=b.x;z=b.z
  } else if(value==='river'||value==='headwater'||value==='lakeoutlet'){
    // Terrain-derived drainage can start at any altitude. Frame the widest
    // available trunk instead of assuming the old fixed lake-to-sea range.
    const candidates=value==='lakeoutlet'?riverReaches(-2,-1).filter(r=>r.fromId==='-29:-5'||r.fromId==='-29:-4'):riverReaches(-2,-2)
    const r=value==='headwater'?candidates.find(r=>r.source):candidates.reduce((best,candidate)=>
      !best||Math.max(candidate.wa,candidate.wb)>Math.max(best.wa,best.wb)?candidate:best,null)
    if(!r) throw new Error('Review river no longer has an emitted drainage reach')
    x=(r.ax+r.bx)/2;z=(r.az+r.bz)/2
    // Review an entire connected waterway, not one flattering join. Follow
    // the widest incoming branch upstream and exact cross-sections downstream.
    const local=[]
    const cx=Math.floor(x/32000),cz=Math.floor(z/32000)
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)local.push(...riverReaches(cx+dx,cz+dz))
    const key=(x,z)=>`${x.toFixed(2)},${z.toFixed(2)}`
    const incoming=new Map(),outgoing=new Map()
    for(const reach of local){
      const end=key(reach.bx,reach.bz),start=key(reach.ax,reach.az)
      if(!incoming.has(end)||incoming.get(end).wa<reach.wa)incoming.set(end,reach)
      if(!outgoing.has(start)||outgoing.get(start).wb<reach.wb)outgoing.set(start,reach)
    }
    let first=r
    const seen=new Set([r.id])
    while(incoming.has(key(first.ax,first.az))){
      const next=incoming.get(key(first.ax,first.az));if(seen.has(next.id))break
      seen.add(next.id);first=next
    }
    riverTour=[];seen.clear()
    while(first&&!seen.has(first.id)){
      seen.add(first.id);riverTour.push(first);first=outgoing.get(key(first.bx,first.bz))
    }
    riverTourOffsets=[0]
    for(const reach of riverTour)riverTourOffsets.push(riverTourOffsets.at(-1)+reach.length)
    riverTourLength=riverTourOffsets.at(-1)
    riverTourIndex=0;riverTourT=0
  } else if(value==='city'||value==='village'){
    settlement=findSettlementNear(x,z,value)
    if(!settlement) throw new Error('Review settlement no longer meets terrain suitability')
    x=settlement.x;z=settlement.z
  } else if(value==='roadlink'){
    const pair=findRoadPair(x,z)
    if(!pair) throw new Error('Review road settlements no longer meet terrain suitability')
    const {a,b}=pair
    x=(a.x+b.x)/2;z=(a.z+b.z)/2
    settlement={radius:Math.hypot(a.x-b.x,a.z-b.z)/2,
      buildings:[...a.buildings,...b.buildings]}
  } else if(value==='mesa'){
    const found=findLandscapeTarget(x,z,c=>c.biome==='mesa'&&c.height<1500,c=>
      .5+(c.landform.plateau??0)*.8+(c.features.ravine??0)*.35)
    x=found.x;z=found.z
  } else if(value==='green'){
    const found=findLandscapeTarget(x,z,c=>
      (c.biome==='plains'||c.biome==='forest'||c.biome==='hills')&&c.height<650,c=>
      .6+(c.biome==='plains'? .25:0)+(c.height<350? .2:0))
    x=found.x;z=found.z
  }
  frameWorld({x,z,y:sampleTerrainHeight(x,z)})
  if(value==='city'||value==='village'||value==='roadlink'){
    const y=sampleTerrainHeight(x,z)
    settlementRadius=settlement.radius
    settlementKind=value
    settlementTop=Math.max(700,...settlement.buildings.map(building=>building.y+building.height))
    // Frame from above the nearest terrain shoulder so the city/village is
    // not hidden behind a local ridge in orbit mode.
    const offset=Math.max(1300,Math.min(settlementRadius*.26,2800))
    // Settlement framing must use the local shelf, not the highest mountain
    // in the review envelope. A distant alpine peak can be several kilometres
    // taller than the town and previously pushed the camera so high that the
    // city or village collapsed into a few pixels or disappeared behind fog.
    let localPeak=y
    for(let ix=-3;ix<=3;ix++) for(let iz=-3;iz<=3;iz++) {
      localPeak=Math.max(localPeak,sampleTerrainHeight(x+ix*450,z+iz*450))
    }
    const localRelief=Math.min(900,Math.max(0,localPeak-y)*.35)
    const viewY=Math.min(
      Math.max(y+Math.min(settlementRadius*.2,2200)+localRelief,settlementTop+260),
      settlementTop+1300,
    )
    camera.position.set(x+offset,viewY,z-offset)
    controls.target.set(x,y+25,z);controls.update()
    if(value==='roadlink') camera.position.set(x+2400,y+1800,z-2400)
  }
}
document.querySelector('#river-tour').onclick=()=>{
  if(!riverTour.length){document.querySelector('#destination').value='river';visitDestination('river')}
  if(riverTourIndex===riverTour.length-1&&riverTourT>=riverTour[riverTourIndex].length){riverTourIndex=0;riverTourT=0}
  tracingRiver=!tracingRiver;flightView=false;flying=false;controls.enabled=!tracingRiver
  document.querySelector('#river-tour').textContent=tracingRiver?'Pause river trace':'Trace river'
  document.querySelector('#flight-view').textContent='Flight scale view'
}
document.querySelector('#river-progress').oninput=e=>{
  if(!riverTour.length)return
  tracingRiver=false;controls.enabled=true;riverTourDirty=true
  document.querySelector('#river-tour').textContent='Trace river'
  let distance=riverTourLength*Number(e.target.value)/1000
  riverTourIndex=0
  while(riverTourIndex<riverTour.length-1&&distance>riverTour[riverTourIndex].length){distance-=riverTour[riverTourIndex].length;riverTourIndex++}
  riverTourT=distance
}
document.querySelector('#review-view').onchange=()=>{if(riverTour.length)riverTourDirty=true;weatherTraceDirty=true}
document.querySelector('#weather-progress').oninput=()=>{weatherTraceDirty=true;flying=false;weatherTravelT=Number(document.querySelector('#weather-progress').value)/1000}
document.querySelector('#weather-height').oninput=()=>{weatherTraceDirty=true;flying=false;document.querySelector('#fly').textContent='Flight benchmark'}
document.querySelector('#destination').onchange=e=>visitDestination(e.target.value)
function applyReviewWeather(){
  const value=document.querySelector('#weather').value
  if(value==='automatic')world.atmosphere.setAutomaticWeather(true,world.atmosphere.weatherSimulationTime)
  else world.atmosphere.setWeather(value,true)
}
document.querySelector('#weather').onchange=applyReviewWeather
const requested=new URLSearchParams(location.search).get('destination')
if(requested){document.querySelector('#destination').value=requested;visitDestination(requested)}
let previous=performance.now()
let frames=0
let timings=[]
let flying=false
document.querySelector('#fly').onclick=()=>{
  flying=!flying;document.querySelector('#fly').textContent=flying?'Stop benchmark':'Flight benchmark'
  if(flying){travelSeconds=travelDistance=travelFrameCount=0;travelStartHeap=performance.memory?.usedJSHeapSize??0;travelPeakHeap=travelStartHeap}
}
document.querySelector('#flight-view').onclick=()=>{
  flightView=!flightView;controls.enabled=!flightView;reviewJet.mesh.visible=flightView
  flying=false;document.querySelector('#fly').textContent='Flight benchmark'
  document.querySelector('#flight-view').textContent=flightView?'Orbit view':'Flight scale view'
  if(flightView){
    // Start at the settlement edge and above its skyline. The old centerline
    // spawn put the aircraft inside city towers, making the landmark appear
    // absent in flight-scale review and immediately triggering collisions.
    const edge=Math.max(900,settlementRadius*.78)
    const x=controls.target.x+edge,z=controls.target.z-edge
    const terrainY=sampleTerrainHeight(x,z)
    const skyline=settlementKind==='city' ? 2400 : settlementKind==='village' ? 1100 : 700
    const spawnY=settlementKind
      ? Math.max(terrainY+skyline,settlementTop+450)
      : Math.max(terrainY+skyline,reviewPeak+550)
    reviewJet.reset({x,z,y:spawnY,yaw:0})
    chase.setMode('chase',reviewJet)
  }
}
renderer.setAnimationLoop(now=>{
  if(document.hidden){previous=now;return}
  timings.push(now-previous);if(timings.length>90)timings.shift()
  const dt=Math.min((now-previous)/1000,1/30);previous=now
  if(flying){
    const speed=document.querySelector('#flight-speed').value==='maximum'?flightConfig.maxSpeedBoost:400
    travelSeconds+=dt;travelDistance+=dt*speed
    travelFrames[travelFrameCount%travelFrames.length]=timings.at(-1);travelFrameCount++
    travelPeakHeap=Math.max(travelPeakHeap,performance.memory?.usedJSHeapSize??0)
    if(reviewMode.startsWith('weather')){weatherTravelT+=dt*speed/28000;weatherTraceDirty=true}
  }
  if(weatherTraceDirty&&reviewMode.startsWith('weather')){
    weatherTraceDirty=false;flightView=false;tracingRiver=false
    const t=flying?weatherTravelT:Number(document.querySelector('#weather-progress').value)/1000
    const dx=reviewMode==='weatherfront'?-Math.SQRT1_2:1,dz=reviewMode==='weatherfront'?-Math.SQRT1_2:0
    const start=destinations[reviewMode],x=start[1]+dx*t*28000,z=start[2]+dz*t*28000
    const y=sampleTerrainHeight(x,z)+Number(document.querySelector('#weather-height').value),view=document.querySelector('#review-view').value
    reviewJet.reset({x,z,y,yaw:Math.atan2(dx,-dz)})
    reviewJet.mesh.visible=view==='chase';controls.enabled=view==='overview'
    if(view==='overview'){
      camera.position.set(x-dx*1800,y+1000,z-dz*1800)
      controls.target.set(x+dx*2200,y,z+dz*2200)
    }else{
      camera.position.set(x-dx*(view==='chase'?140:0),y+(view==='chase'?45:0),z-dz*(view==='chase'?140:0))
      controls.target.set(x+dx*1500,y-25,z+dz*1500)
    }
    camera.lookAt(controls.target)
  }
  if((tracingRiver||riverTourDirty)&&riverTour.length){
    riverTourDirty=false
    const speed=document.querySelector('#flight-speed').value==='maximum'?flightConfig.maxSpeedBoost:400
    if(tracingRiver)riverTourT+=dt*speed
    while(riverTourT>riverTour[riverTourIndex].length){
      riverTourT-=riverTour[riverTourIndex].length
      if(riverTourIndex===riverTour.length-1){tracingRiver=false;controls.enabled=true;document.querySelector('#river-tour').textContent='Trace river';riverTourT=riverTour[riverTourIndex].length;break}
      riverTourIndex++
    }
    const r=riverTour[riverTourIndex],t=riverTourT/r.length
    if(tracingRiver)document.querySelector('#river-progress').value=1000*(riverTourOffsets[riverTourIndex]+riverTourT)/riverTourLength
    const x=r.ax+r.dx*t,z=r.az+r.dz*t,y=r.ya+(r.yb-r.ya)*t
    tourPosition.set(x,y,z);tourAhead.set(x+r.dx/r.length*500,y,z+r.dz/r.length*500)
    const view=document.querySelector('#review-view').value
    if(view==='overview'){
      camera.position.set(x+1100,y+1800,z-1100);controls.target.copy(tourPosition);camera.lookAt(tourPosition)
      reviewJet.mesh.visible=false
    }else{
      const heading=Math.atan2(r.dx,-r.dz)
      reviewJet.reset({x,z,y:y+170,yaw:heading});reviewJet.mesh.visible=view==='chase'
      const dx=r.dx/r.length,dz=r.dz/r.length
      camera.position.set(x-dx*(view==='chase'?140:0),y+(view==='chase'?215:170),z-dz*(view==='chase'?140:0))
      tourAhead.y=y+140;camera.lookAt(tourAhead);controls.target.copy(tourPosition)
    }
  }
  if(flying&&!flightView&&!reviewMode.startsWith('weather')){
    const speed=document.querySelector('#flight-speed').value==='maximum'?flightConfig.maxSpeedBoost:400
    const step=dt*speed
    camera.position.x+=step;controls.target.x+=step
    const floor=sampleTerrainHeight(controls.target.x,controls.target.z)+1200
    const rise=Math.max(0,floor-controls.target.y)
    controls.target.y+=rise;camera.position.y+=rise;controls.update()
  }
  world.atmosphere.timeOfDay=.48
  const focus=flightView||reviewMode.startsWith('weather')?reviewJet.position:controls.target
  world.update(focus.x,focus.y,focus.z,dt)
  if(flightView) chase.update(reviewJet,dt)
  renderer.render(world.scene,flightView?chase.camera:camera)
  frames++
  if(frames%15===0){
    const sorted=[...timings].sort((a,b)=>a-b)
    document.querySelector('#stats').textContent=' · '+world.atmosphere.weatherLabel+' · '+world.terrain.root.children.length+' tiles · '+renderer.info.render.calls+' draws · '+Math.round(renderer.info.render.triangles/1000)+'k tris · '+sorted[Math.floor(sorted.length*.5)].toFixed(1)+'ms median / '+sorted[Math.floor(sorted.length*.95)].toFixed(1)+'ms p95 · '+world.settlements.count+' settlements / '+world.settlements.buildingCount+' buildings · '+world.settlements.roadCount+' regional roads · '+world.settlements.pendingCount+' pending'
    if(travelFrameCount){
      const sample=travelFrames.slice(0,Math.min(travelFrameCount,travelFrames.length)).sort()
      const heap=performance.memory?.usedJSHeapSize??0
      const memory=heap?' · heap '+(travelStartHeap/1048576).toFixed(0)+' → '+(heap/1048576).toFixed(0)+' MB (peak '+(travelPeakHeap/1048576).toFixed(0)+')':' · heap unavailable'
      document.querySelector('#travel-stats').textContent='Travel '+travelSeconds.toFixed(1)+' s / '+(travelDistance/1000).toFixed(1)+' km · frame median '+sample[Math.floor(sample.length*.5)].toFixed(1)+' ms / p95 '+sample[Math.floor(sample.length*.95)].toFixed(1)+' ms'+memory+' · GPU geometries '+renderer.info.memory.geometries+' / textures '+renderer.info.memory.textures
    }
  }
})
onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();chase.resize(innerWidth,innerHeight)}
</script>
</html>
