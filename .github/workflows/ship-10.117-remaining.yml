name: ship-10.117-remaining
on:
  push:
    paths:
      - 'dev/TRIGGER_10_117'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply remaining 10.117 commits
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat dev/10.117-veil.a.patch dev/10.117-veil.b.patch > /tmp/veil.patch
          cat dev/10.117-docs.a.patch dev/10.117-docs.b.patch > /tmp/docs.patch

          git apply --verbose /tmp/veil.patch
          git add index.html src/style.css src/ui/HUD.ts
          git commit -m "[10.117] Wire blackout and redout HUD veil"

          git apply --verbose dev/10.117-banners.patch
          git add src/main.ts
          git commit -m "[10.117] Announce BLACKOUT and REDOUT banners"

          git apply --verbose /tmp/docs.patch
          rm -f .github/workflows/ship-10.117-remaining.yml
          rm -f dev/TRIGGER_10_117
          rm -f dev/10.117-*.patch
          git add -A
          git commit -m "[10.117] Document high-G vision feedback"

          git push origin HEAD:main
