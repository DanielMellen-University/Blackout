name: restore-camera-storm
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild CameraSystem from staged parts
        run: |
          set -euo pipefail
          python3 scripts/restore_camera_storm.py
          wc -c src/camera/CameraSystem.ts
          grep -q setStormBuffet src/camera/CameraSystem.ts
          git config user.name "DanielMellen-University"
          git config user.email "113362200+DanielMellen-University@users.noreply.github.com"
          git add src/camera/CameraSystem.ts
          git commit -m "feat: restore CameraSystem storm buffet (full source)"
          git rm -f scripts/restore_camera_storm.py scripts/.cam_restore_0.z64 scripts/.cam_restore_1.z64 .github/workflows/restore-camera-storm.yml || true
          git commit -m "ci: remove CameraSystem restore staging" || true
          git push origin HEAD:main
