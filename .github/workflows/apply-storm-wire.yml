name: Apply storm buffet wire
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/apply-storm-wire.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patches
        run: |
          set -euo pipefail
          if [ ! -f .ci/storm-main.patch ]; then
            echo "patches already applied or missing"
            exit 0
          fi
          git apply .ci/storm-main.patch
          git apply .ci/storm-aircraft.patch
          git apply .ci/storm-changelog.patch
          git apply .ci/storm-camtest.patch
          test -n "$(git status --porcelain)"
          grep -nE 'setStormBuffet|stormBuffetDrive' src/main.ts src/aircraft/Aircraft.ts
          grep -nE 'storm buffet' CHANGELOG.md
          grep -nE 'setStormBuffet' tests/cameraSystem.test.ts
      - name: Commit, cleanup staging, push
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts src/aircraft/Aircraft.ts CHANGELOG.md tests/cameraSystem.test.ts
          git rm -r .ci || true
          git rm .github/workflows/apply-storm-wire.yml || true
          git commit -m "feat: wire storm buffet through main and Aircraft"
          git push origin HEAD:main
