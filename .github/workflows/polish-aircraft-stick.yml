name: polish-aircraft-stick
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/polish-aircraft-stick.yml"
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply stick throw and vapor polish to Aircraft
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib, subprocess
          patch = base64.b64decode("")
          pathlib.Path('/tmp/aircraft.patch').write_bytes(patch)
          subprocess.check_call(['patch','-p0','--batch','-i','/tmp/aircraft.patch'])
          raw = pathlib.Path('src/aircraft/Aircraft.ts').read_text()
          assert 'controlSurfaceTargets' in raw
          assert '0.34' in raw
          print('Aircraft lines', len(raw.splitlines()))
          PY
          git config user.name "DanielMellen-University"
          git config user.email "113362200+DanielMellen-University@users.noreply.github.com"
          git add src/aircraft/Aircraft.ts
          git commit -m "Open the stick, boards, and mil-turn vapor"
          git push origin HEAD:main
# bump: trigger stick polish
