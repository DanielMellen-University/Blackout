name: restore-aircraft
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and commit full Aircraft.ts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zlib, base64, pathlib
          z = ""
          raw = zlib.decompress(base64.b64decode(z))
          pathlib.Path("src/aircraft/Aircraft.ts").write_bytes(raw)
          print("restored", len(raw))
          PY
          git config user.name "DanielMellen-University"
          git config user.email "113362200+DanielMellen-University@users.noreply.github.com"
          git add src/aircraft/Aircraft.ts
          git commit -m "Open the stick, boards, and mil-turn vapor" || echo "no change"
          git push origin HEAD:main
