name: restore-aircraft
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Aircraft from 82b3aa3 and apply stick/boards/vapor polish
        run: |
          set -euo pipefail
          git show 82b3aa378ba0a53ef365185173ba653f259c488f:src/aircraft/Aircraft.ts > src/aircraft/Aircraft.ts
          test -f src/aircraft/controlSurfaces.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/aircraft/Aircraft.ts')
          text = p.read_text()
          old_import = "import { FlightModel, runwayGripForWeather } from './FlightModel'\n"
          new_import = (
              "import { FlightModel, runwayGripForWeather } from './FlightModel'\n"
              "import {\n"
              "  controlSurfaceTargets,\n"
              "  wingtipVaporIntensity,\n"
              "} from './controlSurfaces'\n"
          )
          if old_import not in text:
              raise SystemExit('flight import missing')
          if "from './controlSurfaces'" not in text:
              text = text.replace(old_import, new_import, 1)

          old_surfaces = """  private updateControlSurfaces(dt: number): void {
    const pitch = MathUtils.clamp(this.controls.pitch, -1, 1)
    const roll = MathUtils.clamp(this.controls.roll, -1, 1)
    const yaw = MathUtils.clamp(this.controls.yaw, -1, 1)
    const airbrake = this.controls.airbrake ? 1 : 0

    // Differential flaperons show roll while both sides contribute to pitch.
    setSurfaceAngle(this.flaperonLeft, 'x', -pitch * 0.16 - roll * 0.14 + airbrake * 0.1, 14, dt)
    setSurfaceAngle(this.flaperonRight, 'x', -pitch * 0.16 + roll * 0.14 + airbrake * 0.1, 14, dt)
    setSurfaceAngle(this.stabilatorLeft, 'x', -pitch * 0.12 - roll * 0.07 + airbrake * 0.07, 11, dt)
    setSurfaceAngle(this.stabilatorRight, 'x', -pitch * 0.12 + roll * 0.07 + airbrake * 0.07, 11, dt)
    // Both rudders deflect together for yaw; the canted fins remain fixed.
    setSurfaceAngle(this.tailLeft, 'y', yaw * 0.11, 10, dt)
    setSurfaceAngle(this.tailRight, 'y', yaw * 0.11, 10, dt)
  }"""
          new_surfaces = """  private updateControlSurfaces(dt: number): void {
    const targets = controlSurfaceTargets(
      this.controls.pitch,
      this.controls.roll,
      this.controls.yaw,
      this.controls.airbrake,
    )
    // Snappier chase-readable throws; boards dump hard when B is held.
    setSurfaceAngle(this.flaperonLeft, 'x', targets.flaperonLeftX, 16, dt)
    setSurfaceAngle(this.flaperonRight, 'x', targets.flaperonRightX, 16, dt)
    setSurfaceAngle(this.stabilatorLeft, 'x', targets.stabilatorLeftX, 13, dt)
    setSurfaceAngle(this.stabilatorRight, 'x', targets.stabilatorRightX, 13, dt)
    // Both rudders deflect together for yaw; the canted fins remain fixed.
    setSurfaceAngle(this.tailLeft, 'y', targets.rudderY, 12, dt)
    setSurfaceAngle(this.tailRight, 'y', targets.rudderY, 12, dt)
  }"""
          if old_surfaces not in text:
              raise SystemExit('updateControlSurfaces block missing')
          text = text.replace(old_surfaces, new_surfaces, 1)

          old_vapor = """/** Bounded wingtip vapor envelope driven by high speed and hard maneuvering. */
export function wingtipVaporIntensity(speed: number, loadFactor: number): number {
  const safeSpeed = Number.isFinite(speed) ? Math.max(0, speed) : 0
  const safeLoad = Number.isFinite(loadFactor) ? Math.abs(loadFactor) : 1
  const speedT = MathUtils.smoothstep(safeSpeed, 260, 780)
  const loadT = MathUtils.smoothstep(safeLoad, 0.6, 3.5)
  return MathUtils.clamp(speedT * (0.045 + loadT * 0.175), 0, 0.22)
}"""
          new_vapor = "export { controlSurfaceTargets, wingtipVaporIntensity } from './controlSurfaces'"
          if old_vapor not in text:
              raise SystemExit('wingtipVaporIntensity block missing')
          text = text.replace(old_vapor, new_vapor, 1)

          p.write_text(text)
          print('bytes', len(text.encode()))
          assert 'crash(' in text
          assert "from './controlSurfaces'" in text
          PY
          git config user.name "DanielMellen-University"
          git config user.email "113362200+DanielMellen-University@users.noreply.github.com"
          git add src/aircraft/Aircraft.ts
          git commit -m "Open the stick, boards, and mil-turn vapor" || echo "no change"
          git push origin HEAD:main
