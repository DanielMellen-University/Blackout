name: restore-aircraft-base
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore full Aircraft.ts from 82b3aa3
        run: |
          set -euo pipefail
          git show 82b3aa378ba0a53ef365185173ba653f259c488f:src/aircraft/Aircraft.ts > src/aircraft/Aircraft.ts
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('src/aircraft/Aircraft.ts').read_text()
          assert 'crash(' in raw
          assert 'setRenderQuality' in raw
          assert 'export class Aircraft' in raw
          print('Aircraft lines', len(raw.splitlines()))
          PY
          rm -f src/aircraft/controlSurfaces.ts
          git config user.name "DanielMellen-University"
          git config user.email "113362200+DanielMellen-University@users.noreply.github.com"
          git add src/aircraft/Aircraft.ts
          git rm -f src/aircraft/controlSurfaces.ts || true
          # drop broken placeholder workflow if present
          git rm -f .github/workflows/restore-aircraft-full.yml || true
          git commit -m "fix: restore Aircraft.ts after placeholder corruption"
          git push origin HEAD:main
