name: restore-flightmodel
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore FlightModel from 82b3aa3 and apply airbrake polish
        run: |
          set -euo pipefail
          git show 82b3aa378ba0a53ef365185173ba653f259c488f:src/aircraft/FlightModel.ts > src/aircraft/FlightModel.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/aircraft/FlightModel.ts')
          text = p.read_text()
          old = "            extra += C.airbrakeStrength * MathUtils.clamp(s2 / 160, 0.2, 1)\n"
          new = (
              "            // Full bite near mil cruise; softer on final so approach stays flyable.\n"
              "            extra += C.airbrakeStrength * MathUtils.clamp(s2 / 200, 0.18, 1)\n"
          )
          if old not in text:
              raise SystemExit('expected airbrake line missing')
          p.write_text(text.replace(old, new, 1))
          print('lines', len(p.read_text().splitlines()))
          PY
          git config user.name "DanielMellen-University"
          git config user.email "113362200+DanielMellen-University@users.noreply.github.com"
          git add src/aircraft/FlightModel.ts
          git commit -m "fix: restore FlightModel.ts after placeholder corruption"
          git push origin HEAD:main
