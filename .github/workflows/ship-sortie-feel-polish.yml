name: ship-sortie-feel-polish
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ship-sortie-feel-polish.yml"
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ship HUD flare, vapor tests, and changelog
        run: |
          set -euo pipefail
          git config user.name "DanielMellen-University"
          git config user.email "113362200+DanielMellen-University@users.noreply.github.com"
          python3 - <<'PY'
          import base64, pathlib
          pathlib.Path('/tmp/ship_polish.py').write_bytes(base64.b64decode(""))
          PY
          python3 /tmp/ship_polish.py
          git push origin HEAD:main
