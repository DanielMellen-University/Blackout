name: ship-buffet-hud-polish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/ship-frags/buffet_hud_polish_ops.json'
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    # Skip the commits that this job itself pushes (ops already consumed).
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply buffet HUD polish
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/ship-frags/buffet_hud_polish_ops.json ]; then
            echo 'ops already consumed; nothing to do'
            exit 0
          fi
          git config user.name "DanielMellen-University"
          git config user.email "113362200+DanielMellen-University@users.noreply.github.com"
          python3 .github/ship-frags/apply_buffet_hud_polish.py ops_608
          git add src/ui/HUD.ts tests/hud.test.ts
          git commit -m "[10.608] Prefer BUFFET over SHIFT on HUD"
          python3 .github/ship-frags/apply_buffet_hud_polish.py ops_609
          git add src/main.ts src/core/Version.ts CHANGELOG.md README.md
          git commit -m "[10.609] Keep HUD buffet independent of gear damp"
          rm -rf .github/ship-frags
          rm -f .github/workflows/ship-buffet-hud-polish.yml
          git add -A .github
          git commit -m "ci: remove spent buffet HUD polish staging"
          git push origin HEAD:main
